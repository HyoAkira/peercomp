services:
  mongo:
    image: mongo
    container_name: peercomp_mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: [REDACTED_LOCAL_DEV_USER]
      MONGO_INITDB_ROOT_PASSWORD: [REDACTED_LOCAL_DEV_PASSWORD]

    volumes:
      - peercomp_data:/data/db

    networks:
      - peercomp

    ulimits:
      nofile:
        soft: 64000
        hard: 64000
  redis:
    image: redis
    container_name: peercomp_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server 
      --maxmemory 10gb 
      --maxmemory-policy allkeys-lru 
      --requirepass "[REDACTED_LOCAL_DEV_PASSWORD]"
      --appendonly yes
    ports:
      - "6379:6379"

    networks:
      - peercomp

networks:
  peercomp:
    driver: bridge

volumes:
  peercomp_data:
  redis_data:
