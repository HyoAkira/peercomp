services:
  mongo:
    image: mongo
    container_name: peercomp_mongo
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: [REDACTED_LOCAL_DEV_USER]
      MONGO_INITDB_ROOT_PASSWORD: [REDACTED_LOCAL_DEV_PASSWORD]

    volumes:
      - org_peercomp_data:/data/db

    networks:
      - peercomp

    ulimits:
      nofile:
        soft: 64000
        hard: 64000

  ngi:
    image: nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    network_mode: host
