events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Küresel Proxy ve Header Ayarları
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP -> HTTPS Yönlendirmesi
    server {
        listen 80;
        server_name peercomp.com.tr.localhost ~^.*\.peercomp\.com\.tr\.localhost$;
        return 301 https://$host$request_uri;
    }

    # =========================================================
    # 1. ANA DOMAİN (peercomp.com.tr.localhost) -> Vite & API'ler
    # =========================================================
    server {
        listen 443 ssl;
        server_name peercomp.com.tr.localhost;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Doğrudan ana domaine girildiğinde Vite'a (Frontend) atar
        location / {
            proxy_pass http://127.0.0.1:5173;
            # Vite HMR (WebSocket) için kritik satırlar:
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Core API / Backend -> Port 3000
        location /api/v1/ {
            proxy_pass http://127.0.0.1:3000/api/;
        }

        # PeerJS Server -> Port 9000 (WebSocket Desteği Aktif)
        location /api/v1/peerserver/ {
            proxy_pass http://127.0.0.1:9000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Sinyalleşme / Peer Servisi -> Port 8000 (WebSocket Desteği Aktif)
        location /api/v1/peers/ {
            proxy_pass http://127.0.0.1:8000/peers;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # MongoDB Dashboard / HTTP Admin -> Port 27017
        location /api/v1/database/mongo/ {
            proxy_pass http://127.0.0.1:27017;
        }
    }

    # =========================================================
    # 2. WILDCARD SUBDOMAINS (*.peercomp.com.tr.localhost) -> Gateway
    # =========================================================
    server {
        listen 443 ssl;
        
        # Önünde ne olursa olsun (örn: deneme.peercomp.com.tr.localhost veya user.sub.peercomp.com.tr.localhost)
        # Hepsini yakalar ve gateway'e (Port 3001) fırlatır.
        server_name ~^(?<subdomain>.+)\.peercomp\.com\.tr\.localhost$;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass http://127.0.0.1:3001;
            
            # Gateway'in içeride hangi tenant/subdomain'den istek geldiğini ayıklayabilmesi için header:
            proxy_set_header X-Subdomain $subdomain;
            proxy_set_header Host $host;
            # Gateway üzerinden WebRTC sinyalleşmesi veya WebSocket geçecekse:
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}